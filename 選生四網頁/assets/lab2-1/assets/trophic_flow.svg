<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="93" text-anchor="middle" font-size="48" font-family="sans-serif" fill="#3b4b30">營養階層串聯：以課本案例提出的關係</text><g fill="#eef3e5" stroke="#66854a" stroke-width="4"><rect x="70" y="220" width="270" height="230" rx="22"/><rect x="410" y="220" width="270" height="230" rx="22"/><rect x="750" y="220" width="270" height="230" rx="22"/><rect x="1090" y="220" width="270" height="230" rx="22"/></g><g font-size="43" font-family="sans-serif" fill="#303d2c" text-anchor="middle"><text x="205" y="310">灰狼回歸</text><text x="545" y="310">馬鹿啃食</text><text x="545" y="380">可能減少</text><text x="885" y="310">部分木本植物</text><text x="885" y="380">有恢復機會</text><text x="1225" y="310">河狸</text><text x="1225" y="380">可利用木本植物</text></g><g font-size="58" font-family="sans-serif" fill="#af6232"><text x="354" y="355">→</text><text x="693" y="355">→</text><text x="1035" y="355">→</text></g><text x="720" y="545" text-anchor="middle" font-size="34" font-family="sans-serif" fill="#566354">示意假說；植被、水文及族群變化也可能受氣候、獵捕等因素影響</text></svg>