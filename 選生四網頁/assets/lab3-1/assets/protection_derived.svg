<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="90" text-anchor="middle" font-size="46" font-family="sans-serif" fill="#49362b">多種制度共同支持棲地保育</text><rect x="65" y="173" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="240" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">森林自然保護區、野生動物保護區</text><rect x="65" y="301" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="368" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">國家公園內的生態保護與研究</text><rect x="65" y="429" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="496" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">七家灣溪重要濕地與棲地管理</text><rect x="65" y="557" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="624" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">不同制度的公告、目的與範圍需分別核對</text></svg>