<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="90" text-anchor="middle" font-size="46" font-family="sans-serif" fill="#49362b">櫻花鉤吻鮭：從資源利用到保育問題</text><rect x="65" y="173" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="240" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">泰雅族傳統稱呼 bunban（本邦）</text><rect x="65" y="301" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="368" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">課本記載 1960 年代後的水庫與沿岸農業開發</text><rect x="65" y="429" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="496" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">族群銳減促成復育、監測與棲地改善</text><rect x="65" y="557" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="624" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">歷史記錄用來了解威脅，不能當作今日族群數量</text></svg>