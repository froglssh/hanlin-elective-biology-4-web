<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="90" text-anchor="middle" font-size="46" font-family="sans-serif" fill="#49362b">七家灣溪一號壩：年份與來源核對</text><rect x="65" y="173" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="240" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">課本 P178 記載：2002 年一號壩拆除</text><rect x="65" y="301" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="368" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">雪霸官方紀錄：2011 年 5 月完成一號壩改善</text><rect x="65" y="429" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="496" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">改善目的：棲地連通與河床環境</text><rect x="65" y="557" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="624" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">仍須監測泥砂、水文及生物群集的恢復</text></svg>