<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="90" text-anchor="middle" font-size="46" font-family="sans-serif" fill="#49362b">復育工作的擴展</text><rect x="65" y="173" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="240" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">人工繁殖與放流：支持族群恢復</text><rect x="65" y="301" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="368" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">退耕與造林：改善濱岸植被及農業污染</text><rect x="65" y="429" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="496" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">溪流整合研究：同時記錄生物、水質與棲地</text><rect x="65" y="557" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="624" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">棲地改善和族群監測持續配合</text></svg>