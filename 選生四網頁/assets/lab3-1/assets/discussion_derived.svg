<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="90" text-anchor="middle" font-size="46" font-family="sans-serif" fill="#49362b">保育討論：從案例到證據</text><rect x="65" y="173" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="240" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">選一種臺灣野生動植物，查明面臨的困境</text><rect x="65" y="301" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="368" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">比較保育與人類需求間的衝突</text><rect x="65" y="429" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="496" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">評估研究、教育、立法與行政的配合困難</text><rect x="65" y="557" width="1310" height="110" rx="18" fill="#f3eee6" stroke="#a56b3e" stroke-width="3"/><text x="720" y="624" text-anchor="middle" font-size="37" font-family="sans-serif" fill="#49362b">哪些成功經驗可借鏡？哪些需因物種調整？</text></svg>