<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960"><rect width="1280" height="960" fill="#fffdf8"/><text x="640" y="85" text-anchor="middle" font-size="47" font-family="sans-serif">保育工作與功能</text><text x="110" y="220" font-size="33" font-family="sans-serif">1. 支持族群恢復</text><rect x="110" y="245" width="1060" height="85" rx="12" fill="#fff" stroke="#a9865f" stroke-width="3"/><text x="110" y="375" font-size="33" font-family="sans-serif">2. 改善野外棲地</text><rect x="110" y="400" width="1060" height="85" rx="12" fill="#fff" stroke="#a9865f" stroke-width="3"/><text x="110" y="530" font-size="33" font-family="sans-serif">3. 協助民眾理解保育</text><rect x="110" y="555" width="1060" height="85" rx="12" fill="#fff" stroke="#a9865f" stroke-width="3"/><text x="110" y="685" font-size="33" font-family="sans-serif">4. 取得可比較的監測資料</text><rect x="110" y="710" width="1060" height="85" rx="12" fill="#fff" stroke="#a9865f" stroke-width="3"/></svg>