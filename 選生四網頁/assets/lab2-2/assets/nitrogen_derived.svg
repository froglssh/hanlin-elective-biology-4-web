<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="95" text-anchor="middle" font-size="48" font-family="sans-serif" fill="#284333">含氮廢物的轉化</text><rect x="70" y="180" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="247" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">有機含氮物 → 分解與氨化 → 氨／銨</text><rect x="70" y="310" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="377" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">硝化：氨／銨 → 亞硝酸鹽 → 硝酸鹽</text><rect x="70" y="440" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="507" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">硝化過程需要氧氣；植物可利用無機氮</text><rect x="70" y="570" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="637" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">硝化與有機物分解是不同的轉化步驟</text></svg>