<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="95" text-anchor="middle" font-size="48" font-family="sans-serif" fill="#284333">明亮有光，但避免直射</text><rect x="70" y="180" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="247" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">光能支持植物與藻類光合作用</text><rect x="70" y="310" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="377" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">直射或強光可能使水溫過高或藻類快速增生</text><rect x="70" y="440" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="507" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">每日同時記錄水溫、光照與生物狀況</text><rect x="70" y="570" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="637" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">增加光照不代表系統一定更穩定</text></svg>