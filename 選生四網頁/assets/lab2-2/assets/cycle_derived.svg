<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="95" text-anchor="middle" font-size="48" font-family="sans-serif" fill="#284333">生態球：物質循環與能量流動</text><rect x="70" y="180" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="247" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">光能 → 植物與藻類 → 化學能 → 呼吸與散熱</text><rect x="70" y="310" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="377" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">植物光合作用：利用 CO₂，產生 O₂ 與有機物</text><rect x="70" y="440" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="507" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">植物、動物及微生物皆可呼吸：耗 O₂、釋 CO₂</text><rect x="70" y="570" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="637" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">物質可再利用；能量持續輸入並向環境散失</text></svg>