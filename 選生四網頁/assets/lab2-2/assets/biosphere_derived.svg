<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf8"/><text x="720" y="95" text-anchor="middle" font-size="48" font-family="sans-serif" fill="#284333">生物圈 2 號：追查氧氣下降</text><rect x="70" y="180" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="247" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">土壤有機物 → 微生物呼吸 → 耗氧並釋出 CO₂</text><rect x="70" y="310" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="377" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">部分 CO₂ 與混凝土反應形成碳酸鈣</text><rect x="70" y="440" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="507" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">不能只用大氣 CO₂ 變化推算整體耗氧量</text><rect x="70" y="570" width="1300" height="108" rx="18" fill="#edf3e9" stroke="#5b8564" stroke-width="3"/><text x="720" y="637" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#284333">追蹤生物、土壤、建材與大氣間的物質收支</text></svg>