<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" fill="#fffdf7"/><text x="720" y="95" text-anchor="middle" font-size="47" font-family="sans-serif" fill="#235748">瘧原蟲感染路徑（依課本 P44 文字整理）</text><g fill="#e9f5ef" stroke="#3d8170" stroke-width="4"><rect x="70" y="240" width="260" height="210" rx="24"/><rect x="407" y="240" width="260" height="210" rx="24"/><rect x="745" y="240" width="260" height="210" rx="24"/><rect x="1082" y="240" width="260" height="210" rx="24"/></g><g font-size="44" font-family="sans-serif" fill="#19392e" text-anchor="middle"><text x="200" y="345">瘧蚊叮咬</text><text x="537" y="345">進入人體</text><text x="875" y="345">肝臟發育</text><text x="1212" y="345">侵入紅血球</text></g><g font-size="62" font-family="sans-serif" fill="#c05d29"><text x="350" y="365">→</text><text x="688" y="365">→</text><text x="1026" y="365">→</text></g><text x="720" y="555" text-anchor="middle" font-size="38" font-family="sans-serif" fill="#43584e">在紅血球內增殖；紅血球破裂後可造成發燒與貧血</text></svg>